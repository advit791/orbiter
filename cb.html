const FALLBACKS = [
  "hmm, not sure about that one. try asking about the game, the founders, or space — that's where i'm strong.",
  "i don't have a great answer for that. ask me about Orbiter, Advit, Shaurya, or space stuff.",

function getReply(input) {
  const q = input.toLowerCase().replace(/[^\w\s]/g, " ");
  const words = q.split(/\s+/);

  let bestMatch = null;
  let bestScore = 0;

  for (const entry of KB) {
    let score = 0;
    for (const tag of entry.tags) {
      if (q.includes(tag)) {
        score += tag.split(" ").length * 2; // longer tag matches score higher
      }
    }
    // also check individual words
    for (const tag of entry.tags) {
      for (const word of words) {
        if (word.length > 3 && tag.includes(word)) score += 1;
      }
    }
    if (score > bestScore) {
      bestScore = score;
      bestMatch = entry;
    }
  }

  if (bestMatch && bestScore >= 2) {
    const replies = bestMatch.replies;
    return replies[Math.floor(Math.random() * replies.length)];
  }

  return FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
}

// ─── UI ────────────────────────────────────────────────────────────────────────
function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function suggest(btn) {
  document.getElementById("userInput").value = btn.textContent;
  autoGrow(document.getElementById("userInput"));
  sendMessage();
}

function appendMsg(role, text) {
  const wrap = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + role;
  const label = document.createElement("span");
  label.className = "msg-label";
  label.textContent = role === "user" ? "you" : "Orbiter AI";
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.textContent = text;
  div.appendChild(label);
  div.appendChild(bubble);
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function showTyping() {
  const wrap = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg ai"; div.id = "typing-indicator";
  const label = document.createElement("span");
  label.className = "msg-label"; label.textContent = "Orbiter AI";
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  div.appendChild(label); div.appendChild(bubble);
  wrap.appendChild(div); wrap.scrollTop = wrap.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  input.value = ""; autoGrow(input);
  document.getElementById("suggestions").style.display = "none";
  appendMsg("user", text);

  showTyping();
  // small delay so it feels like it's "thinking"
  setTimeout(() => {
    removeTyping();
    appendMsg("ai", getReply(text));
  }, 600 + Math.random() * 400);
}
