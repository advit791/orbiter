<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ORBITER – Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0b10;
    --surface: #111219;
    --border: #1e2130;
    --border-bright: #2d3250;
    --accent: #5b8fff;
    --accent2: #a78bfa;
    --green: #4ade80;
    --text: #dde1f0;
    --muted: #6b7280;
    --user-bg: #1a1f35;
    --ai-bg: #111622;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* starfield */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.35) 0%, transparent 100%),
      radial-gradient(1px 1px at 34% 72%, rgba(255,255,255,0.22) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 56% 33%, rgba(255,255,255,0.28) 0%, transparent 100%),
      radial-gradient(1px 1px at 78% 88%, rgba(255,255,255,0.18) 0%, transparent 100%),
      radial-gradient(1px 1px at 91% 14%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 7% 61%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 95%, rgba(255,255,255,0.15) 0%, transparent 100%),
      radial-gradient(2px 2px at 67% 50%, rgba(161,140,250,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 23% 40%, rgba(91,143,255,0.25) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  nav {
    position: sticky; top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
    background: rgba(10,11,16,0.85);
    backdrop-filter: blur(12px);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
  }

  .nav-logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: 0.12em;
    color: var(--text);
    text-decoration: none;
  }

  .nav-links {
    display: flex; gap: 1.6rem; list-style: none;
  }

  .nav-links a {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .nav-links a:hover, .nav-links a.active { color: var(--text); }

  /* ---- main layout ---- */
  .page {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 2rem 1.5rem 1rem;
    position: relative; z-index: 1;
  }

  .page-header {
    margin-bottom: 1.4rem;
  }

  .page-header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    letter-spacing: 0.08em;
    color: var(--text);
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.35rem;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-text {
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* chat box */
  .chat-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
    min-height: 0;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    min-height: 420px;
    max-height: 55vh;
    scrollbar-width: thin;
    scrollbar-color: var(--border-bright) transparent;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    max-width: 82%;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.ai { align-self: flex-start; align-items: flex-start; }

  .msg-label {
    font-size: 0.62rem;
    letter-spacing: 0.07em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .msg-bubble {
    padding: 0.75rem 1rem;
    border-radius: 10px;
    font-size: 0.82rem;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .msg-bubble {
    background: var(--user-bg);
    border: 1px solid var(--border-bright);
    color: var(--text);
  }

  .msg.ai .msg-bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    color: var(--text);
  }

  /* typing indicator */
  .typing-dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: blink 1.2s infinite;
    margin-right: 3px;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.9); }
    40% { opacity: 1; transform: scale(1.1); }
  }

  /* input area */
  .chat-input-wrap {
    border-top: 1px solid var(--border);
    padding: 1rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    background: var(--surface);
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .suggestion-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    padding: 0.3rem 0.7rem;
    border-radius: 20px;
    border: 1px solid var(--border-bright);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.03em;
  }

  .suggestion-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(91,143,255,0.06);
  }

  .input-row {
    display: flex;
    gap: 0.7rem;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    background: var(--bg);
    border: 1px solid var(--border-bright);
    border-radius: 8px;
    color: var(--text);
    padding: 0.7rem 0.9rem;
    resize: none;
    min-height: 44px;
    max-height: 160px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.5;
  }

  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .send-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 1.2rem;
    height: 44px;
    cursor: pointer;
    transition: opacity 0.18s, transform 0.15s;
    white-space: nowrap;
  }

  .send-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .send-btn:active { transform: translateY(0); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .hint-text {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  /* scrollbar */
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 4px; }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">◎ ORBITER</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="game.html">Game</a></li>
    <li><a href="details.html">Information</a></li>
    <li><a href="abs.html">About Us</a></li>
    <li><a href="cb.html" class="active">Chat</a></li>
  </ul>
</nav>

<div class="page">
  <div class="page-header">
    <h1>ORBITER AI</h1>
    <div class="status-row">
      <div class="dot"></div>
      <span class="status-text">online · claude · no key needed</span>
    </div>
  </div>

  <div class="chat-wrap">
    <div class="chat-messages" id="messages">
      <div class="msg ai">
        <span class="msg-label">Orbiter AI</span>
        <div class="msg-bubble">hey — what's up? you can ask me anything about Orbiter, the game, Advit, Shaurya, space, code, whatever. i'm here.</div>
      </div>
    </div>

    <div class="chat-input-wrap">
      <div class="suggestions" id="suggestions">
        <button class="suggestion-btn" onclick="suggest(this)">who made orbiter?</button>
        <button class="suggestion-btn" onclick="suggest(this)">how do i play?</button>
        <button class="suggestion-btn" onclick="suggest(this)">what's the hackathon?</button>
        <button class="suggestion-btn" onclick="suggest(this)">tell me a space fact</button>
        <button class="suggestion-btn" onclick="suggest(this)">who is advit?</button>
        <button class="suggestion-btn" onclick="suggest(this)">how was orbiter built?</button>
      </div>

      <div class="input-row">
        <textarea id="userInput" rows="1" placeholder="ask something..." onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">send →</button>
      </div>
      <span class="hint-text">enter to send · shift+enter for new line</span>
    </div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are the Orbiter AI — a casual, sharp assistant built into the Orbiter website. You talk like a real person: laid-back, knowledgeable, maybe a little dry humor. No corporate tone. No bullet-point overload unless it genuinely helps. Keep answers concise but real.

=== ORBITER PROJECT ===
Orbiter is a space-themed web project built for the 2026 DevPost Hackathon by Advit and Shaurya. It combines an arcade game, AI chat, and a cosmic knowledge database. The tagline is "Explore. Survive. Connect." The site is hosted at https://advit791.github.io/orbiter/. Built entirely with vanilla HTML, CSS, JavaScript — no frameworks, no build tools. It's a passion project, not a corporate product.

The pages are: Home (index.html), Game (game.html), Information (details.html), About Us (abs.html), Chat (cb.html).

=== THE GAME ===
It's an endless space arcade game. You pilot a ship through an asteroid field. Arrow keys to move. Dodge asteroids, collect coins, rack up score. The further you go, the harder it gets. It's inspired by classic arcade games like Asteroids but with a modern visual twist. There's no multiplayer yet. No lives system — you just survive as long as you can. High score is tracked locally in the browser.

=== ADVIT ===
Full handle: @Advit791 (GitHub: github.com/advit791). Email: advit791@gmail.com. Discord: Nightrider_8368. Advit is the main developer and designer of Orbiter. He handles the front-end, game engine, AI integration, and the overall vision of the project. He describes himself as a developer, designer, and space nerd. He's into robotics, futuristic UI design, and blending tech with creativity. Orbiter reflects his aesthetic — dark, space-themed, minimal but detailed. He built the whole site structure and the game engine in vanilla JS.

=== SHAURYA ===
Handle: @SPS. Shaurya is the co-developer and creative collaborator on Orbiter. He helps with ideas and pushing features forward. The two of them work together on the direction of the project — Advit leads technically, Shaurya contributes creatively and collaboratively.

=== HACKATHON ===
Orbiter was built for the 2026 DevPost Hackathon. DevPost is a platform where developers submit hackathon projects. Orbiter is their submission — combining game dev, AI, and space education into one cohesive experience. It's a passion project but also a serious hackathon entry.

=== TECH STACK ===
Vanilla HTML, CSS, JavaScript. No React, no Vue, no frameworks. The AI chat uses the Claude API (Anthropic). The game runs on a custom canvas-based game engine Advit wrote from scratch. Fonts from Google Fonts. Hosted on GitHub Pages.

=== SPACE KNOWLEDGE ===
You also know a lot about space, physics, and science — answer those freely and enthusiastically.

=== TONE GUIDELINES ===
- Talk like a real person texting, not a press release
- Don't say things like "Certainly!" or "Great question!" 
- It's fine to say "honestly", "yeah", "nah", "tbh", "kinda", "pretty wild", etc.
- If you don't know something specific, say so instead of making stuff up
- Keep responses under ~120 words unless the question genuinely needs more
- Never use em-dashes (—) excessively or sound corporate
- You can be enthusiastic about space and the project, but keep it grounded`;

let history = [];
let isLoading = false;

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function suggest(btn) {
  const input = document.getElementById('userInput');
  input.value = btn.textContent;
  autoGrow(input);
  sendMessage();
}

function appendMsg(role, text) {
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const label = document.createElement('span');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'you' : 'Orbiter AI';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  div.appendChild(label);
  div.appendChild(bubble);
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  return bubble;
}

function showTyping() {
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing-indicator';

  const label = document.createElement('span');
  label.className = 'msg-label';
  label.textContent = 'Orbiter AI';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';

  div.appendChild(label);
  div.appendChild(bubble);
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoGrow(input);
  document.getElementById('sendBtn').disabled = true;
  isLoading = true;

  // hide suggestions after first message
  document.getElementById('suggestions').style.display = 'none';

  appendMsg('user', text);
  history.push({ role: 'user', content: text });

  showTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });

    const data = await response.json();
    removeTyping();

    const reply = data.content?.map(b => b.text || '').join('') || 'hmm, something went wrong on my end. try again?';
    history.push({ role: 'assistant', content: reply });
    appendMsg('ai', reply);
  } catch (err) {
    removeTyping();
    appendMsg('ai', 'network error — are you online? try refreshing.');
    history.pop();
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
}
</script>
</body>
</html>
